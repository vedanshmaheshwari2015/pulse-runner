<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pulse Runner</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #080b18;
      color: #f4f6ff;
      font: 16px system-ui, sans-serif;
    }

    main { width: min(1000px, 96vw); }
    h1 { margin: 0 0 8px; letter-spacing: .12em; }
    p { color: #bac4e4; }

    canvas {
      display: block;
      width: 100%;
      border: 2px solid #45527b;
      border-radius: 12px;
      background: #10162b;
      touch-action: manipulation;
    }

    .hint { font-size: 14px; line-height: 1.6; }
  </style>
</head>
<body>
<main>
  <h1>PULSE RUNNER</h1>
  <p>One long run through five different sections.</p>
  <canvas id="game" width="1000" height="420"></canvas>
  <p class="hint">
    Space / ↑ / click / tap: jump · M: music on/off · R: restart<br>
    The ghost shows your previous run.
  </p>
</main>

<script>
"use strict";

const canvas = document.querySelector("#game");
const ctx = canvas.getContext("2d");

const W = canvas.width;
const H = canvas.height;
const groundY = 330;
const chunkSize = 460;
const safeStart = 1000;
const sectionLength = 9200;
const sectionCount = 5;
const totalLength = sectionLength * sectionCount;
const fixedStep = 1 / 120;

const sections = [
  { name: "BLOCK RUN", sky: "#101a35", ground: "#39e8c2", accent: "#8a7dff", root: 220 },
  { name: "SPIKE FIELD", sky: "#162039", ground: "#63d8ff", accent: "#ff5478", root: 196 },
  { name: "SAW WORKS", sky: "#291b32", ground: "#ff945e", accent: "#ffd15c", root: 174 },
  { name: "LASER GRID", sky: "#102a38", ground: "#f6ed78", accent: "#4cf0d5", root: 247 },
  { name: "THE ABYSS", sky: "#211633", ground: "#ff64db", accent: "#72a5ff", root: 164 }
];

const player = {
  x: 150,
  y: groundY - 34,
  size: 34,
  vy: 0,
  rotation: 0
};

let worldX = 0;
let objects = [];
let floors = [{ x: 0, w: safeStart }];
let nextChunk = safeStart;
let sectionIndex = 0;
let speed = 370;
let grounded = true;

let playing = false;
let crashed = false;
let won = false;
let sectionFlash = 0;

let ghostRun = [];
let previousGhost = null;

let audio = null;
let musicTimer = null;
let musicOn = true;
let beat = 0;

let lastTime = null;
let accumulator = 0;

function addBlock(x, height, width) {
  objects.push({
    type: "block",
    x,
    y: groundY - height,
    w: width,
    h: height
  });
}

function addHazard(type, x, y, w, h) {
  objects.push({ type, x, y, w, h });
}

function addSpikeRow(x, count) {
  for (let i = 0; i < count; i++) {
    addHazard("spike", x + i * 36, groundY - 34, 32, 34);
  }
}

function makeChunk(x) {
  const area = Math.min(
    sectionCount - 1,
    Math.floor(x / sectionLength)
  );
  const sectionEnd = (area + 1) * sectionLength;

  // Keep section transitions clear and avoid patterns crossing into
  // the next section.
  if (x + chunkSize > sectionEnd) {
    floors.push({ x, w: chunkSize });
    return;
  }

  const chunkInArea = Math.floor((x - area * sectionLength) / chunkSize);
  const pattern = chunkInArea % 3;

  // Each section uses one obstacle family.
  if (area === 4) {
    // Section 5: gaps only.
    if (pattern === 1) {
      floors.push({ x, w: chunkSize });
      return;
    }

    const pitStart = x + 190;
    const pitWidth = 175 + pattern * 12;
    const pitEnd = pitStart + pitWidth;

    floors.push({ x, w: pitStart - x });
    floors.push({ x: pitEnd, w: x + chunkSize - pitEnd });
    return;
  }

  floors.push({ x, w: chunkSize });

  if (area === 0) {
    // Section 1: climbable blocks only.
    if (pattern === 0) {
      addBlock(x + 175, 54, 62);
    } else if (pattern === 1) {
      addBlock(x + 125, 48, 58);
      addBlock(x + 275, 66, 68);
    } else {
      addBlock(x + 105, 44, 56);
      addBlock(x + 215, 72, 66);
      addBlock(x + 335, 54, 58);
    }
    return;
  }

  if (area === 1) {
    // Section 2: spikes only.
    addSpikeRow(x + 175, pattern + 1);
    return;
  }

  if (area === 2) {
    // Section 3: saws only.
    const count = pattern === 0 ? 1 : 2;
    for (let i = 0; i < count; i++) {
      addHazard("saw", x + 180 + i * 115, groundY - 44, 40, 40);
    }
    return;
  }

  // Section 4: lasers only. Their tops are low enough to jump over.
  const count = pattern === 2 ? 2 : 1;
  for (let i = 0; i < count; i++) {
    const laserHeight = 100 + pattern * 8;
    addHazard(
      "laser",
      x + 205 + i * 125,
      groundY - laserHeight,
      22,
      laserHeight
    );
  }
}

function ensureWorld() {
  while (nextChunk < worldX + W + 700) {
    makeChunk(nextChunk);
    nextChunk += chunkSize;
  }

  objects = objects.filter(o => o.x + o.w > worldX - 100);
  floors = floors.filter(f => f.x + f.w > worldX - 100);
}

function resetGame() {
  if (ghostRun.length > 5) {
    previousGhost = ghostRun.slice();
  }

  worldX = 0;
  objects = [];
  floors = [{ x: 0, w: safeStart }];
  nextChunk = safeStart;

  sectionIndex = 0;
  speed = 370;
  grounded = true;

  player.y = groundY - player.size;
  player.vy = 0;
  player.rotation = 0;

  playing = true;
  crashed = false;
  won = false;
  sectionFlash = 0;
  accumulator = 0;
  beat = 0;

  ghostRun = [{ x: 0, y: player.y }];

  ensureWorld();
  startMusic();
}

function jump() {
  if (!playing) {
    resetGame();
    return;
  }

  if (grounded) {
    player.vy = -670;
    grounded = false;
  }
}

function keyHandler(event) {
  if (["Space", "ArrowUp", "KeyW"].includes(event.code)) {
    event.preventDefault();
    if (!event.repeat) jump();
  }

  if (event.code === "KeyM") {
    musicOn = !musicOn;
    if (musicOn) startMusic();
    else stopMusic();
  }

  if (event.code === "KeyR") resetGame();
}

addEventListener("keydown", keyHandler);
canvas.addEventListener("pointerdown", jump);

function startMusic() {
  if (!musicOn) return;

  const AudioContextClass = window.AudioContext || window.webkitAudioContext;
  if (!AudioContextClass) return;

  if (!audio) audio = new AudioContextClass();
  audio.resume();

  if (musicTimer) return;

  musicTimer = setInterval(() => {
    if (!playing || !musicOn || !audio) return;

    const section = sections[sectionIndex];
    const scale = [0, 3, 5, 7, 10, 12, 15, 17];
    const step = scale[(beat * 3 + sectionIndex) % scale.length];
    const note = section.root * Math.pow(2, step / 12);

    playTone(note, beat % 4 === 0 ? 0.15 : 0.07, "triangle");
    if (beat % 4 === 0) {
      playTone(section.root / 2, 0.12, "sine");
    }
    beat++;
  }, 180);
}

function stopMusic() {
  if (musicTimer) {
    clearInterval(musicTimer);
    musicTimer = null;
  }
}

function playTone(frequency, duration, wave) {
  const oscillator = audio.createOscillator();
  const gain = audio.createGain();

  oscillator.type = wave;
  oscillator.frequency.value = frequency;

  gain.gain.setValueAtTime(0.0001, audio.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.035, audio.currentTime + 0.015);
  gain.gain.exponentialRampToValueAtTime(
    0.0001,
    audio.currentTime + duration
  );

  oscillator.connect(gain);
  gain.connect(audio.destination);
  oscillator.start();
  oscillator.stop(audio.currentTime + duration + 0.02);
}

function overlaps(a, b) {
  return a.x < b.x + b.w &&
         a.x + a.w > b.x &&
         a.y < b.y + b.h &&
         a.y + a.h > b.y;
}

function die() {
  if (!playing) return;
  crashed = true;
  playing = false;
  grounded = false;
  previousGhost = ghostRun.slice();
}

function update(dt) {
  if (!playing) return;

  const oldWorldX = worldX;
  const oldY = player.y;
  const oldBottom = oldY + player.size;

  const newSection = Math.min(
    sectionCount - 1,
    Math.floor(worldX / sectionLength)
  );

  if (newSection !== sectionIndex) {
    sectionIndex = newSection;
    sectionFlash = 1.5;
    beat = 0;
  }

  const sectionProgress = (worldX % sectionLength) / sectionLength;
  speed = 370 + sectionIndex * 18 + sectionProgress * 18;

  worldX += speed * dt;
  ensureWorld();

  player.vy += 1800 * dt;
  player.y += player.vy * dt;
  player.rotation += speed * dt * 0.012;

  grounded = false;

  const playerWorld = {
    x: worldX + player.x,
    y: player.y,
    w: player.size,
    h: player.size
  };

  // Blocks are solid: land on top, die on a side impact.
  for (const object of objects) {
    if (object.type !== "block") continue;

    const overlapsX =
      playerWorld.x < object.x + object.w &&
      playerWorld.x + playerWorld.w > object.x;

    const crossedTop =
      oldBottom <= object.y + 3 &&
      player.y + player.size >= object.y &&
      player.vy >= 0;

    if (overlapsX && crossedTop) {
      player.y = object.y - player.size;
      player.vy = 0;
      playerWorld.y = player.y;
      grounded = true;
    } else if (overlaps(playerWorld, object)) {
      die();
      return;
    }
  }

  // Land only when the player is over a floor segment.
  if (!grounded) {
    const centerX = worldX + player.x + player.size / 2;
    const hasFloor = floors.some(
      floor => centerX >= floor.x && centerX <= floor.x + floor.w
    );

    if (
      hasFloor &&
      oldBottom <= groundY + 2 &&
      player.y + player.size >= groundY &&
      player.vy >= 0
    ) {
      player.y = groundY - player.size;
      player.vy = 0;
      grounded = true;
    }
  }

  playerWorld.y = player.y;

  for (const object of objects) {
    if (object.type === "block") continue;

    // Slightly smaller hitbox for spikes makes their tips fairer.
    const hitbox = object.type === "spike"
      ? {
          x: object.x + 5,
          y: object.y + 8,
          w: object.w - 10,
          h: object.h - 8
        }
      : object;

    if (overlaps(playerWorld, hitbox)) {
      die();
      return;
    }
  }

  if (player.y > H + 45) {
    die();
    return;
  }

  ghostRun.push({ x: worldX, y: player.y });

  if (worldX >= totalLength) {
    playing = false;
    won = true;
    previousGhost = ghostRun.slice();
  }

  if (sectionFlash > 0) sectionFlash -= dt;
}

function ghostYAt(distance) {
  if (!previousGhost || previousGhost.length === 0) return null;
  if (distance < previousGhost[0].x) return previousGhost[0].y;
  if (distance > previousGhost[previousGhost.length - 1].x) return null;

  let low = 0;
  let high = previousGhost.length - 1;

  while (low < high) {
    const mid = Math.floor((low + high) / 2);
    if (previousGhost[mid].x < distance) low = mid + 1;
    else high = mid;
  }

  const after = previousGhost[low];
  const before = previousGhost[Math.max(0, low - 1)];
  const span = after.x - before.x;
  if (span <= 0) return after.y;

  const amount = (distance - before.x) / span;
  return before.y + (after.y - before.y) * amount;
}

function draw() {
  const section = sections[sectionIndex];

  ctx.fillStyle = section.sky;
  ctx.fillRect(0, 0, W, H);

  // Background lights move more slowly than the level.
  ctx.globalAlpha = 0.25;
  ctx.fillStyle = section.accent;
  for (let i = 0; i < 18; i++) {
    const x = ((i * 91 - worldX * 0.2) % (W + 80) + W + 80) % (W + 80);
    ctx.fillRect(x, 65 + (i * 37) % 190, 3, 3);
  }
  ctx.globalAlpha = 1;

  // Draw floor segments. Missing segments are deadly pits.
  for (const floor of floors) {
    const screenX = floor.x - worldX;
    ctx.fillStyle = "#263454";
    ctx.fillRect(screenX, groundY, floor.w, H - groundY);
    ctx.fillStyle = section.ground;
    ctx.fillRect(screenX, groundY, floor.w, 4);
  }

  for (const object of objects) {
    const x = object.x - worldX;

    if (object.type === "block") {
      ctx.fillStyle = "#596a96";
      ctx.fillRect(x, object.y, object.w, object.h);
      ctx.fillStyle = section.ground;
      ctx.fillRect(x, object.y, object.w, 5);
      ctx.fillStyle = "#8291ba";

      for (let bx = x + 12; bx < x + object.w; bx += 24) {
        ctx.fillRect(bx, object.y + 12, 3, Math.max(4, object.h - 18));
      }
    } else if (object.type === "spike") {
      ctx.fillStyle = "#ff5478";
      ctx.beginPath();
      ctx.moveTo(x, object.y + object.h);
      ctx.lineTo(x + object.w / 2, object.y);
      ctx.lineTo(x + object.w, object.y + object.h);
      ctx.closePath();
      ctx.fill();
    } else if (object.type === "saw") {
      ctx.fillStyle = "#ffd15c";
      ctx.beginPath();
      ctx.arc(x + object.w / 2, object.y + object.h / 2, object.w / 2, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = "#713a43";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(x + 8, object.y + 8);
      ctx.lineTo(x + object.w - 8, object.y + object.h - 8);
      ctx.moveTo(x + object.w - 8, object.y + 8);
      ctx.lineTo(x + 8, object.y + object.h - 8);
      ctx.stroke();
    } else if (object.type === "laser") {
      ctx.fillStyle = "#ff365f";
      ctx.fillRect(x, object.y, object.w, object.h);
      ctx.fillStyle = "#ffd4df";
      ctx.fillRect(x + 7, object.y, 5, object.h);
    }
  }

  // Replay the previous attempt as a translucent ghost.
  const ghostY = ghostYAt(worldX);
  if (ghostY !== null) {
    ctx.save();
    ctx.globalAlpha = 0.35;
    ctx.fillStyle = "#60f4ff";
    ctx.fillRect(player.x, ghostY, player.size, player.size);
    ctx.restore();
  }

  // Player rotates while airborne, like a cube-style runner.
  ctx.save();
  ctx.translate(player.x + player.size / 2, player.y + player.size / 2);
  if (!grounded) ctx.rotate(player.rotation);
  ctx.fillStyle = "#f8f7ff";
  ctx.fillRect(-player.size / 2, -player.size / 2, player.size, player.size);
  ctx.fillStyle = section.accent;
  ctx.fillRect(4, -8, 6, 6);
  ctx.restore();

  const percent = Math.min(100, Math.floor(worldX / totalLength * 100));

  ctx.fillStyle = "#fff";
  ctx.font = "bold 17px system-ui";
  ctx.fillText(
    `SECTION ${sectionIndex + 1} / ${sectionCount}  ·  ${section.name}`,
    22,
    30
  );
  ctx.textAlign = "right";
  ctx.fillText(`${percent}%`, W - 22, 30);
  ctx.textAlign = "left";

  ctx.fillStyle = "#ffffff30";
  ctx.fillRect(22, 42, W - 44, 7);
  ctx.fillStyle = section.ground;
  ctx.fillRect(22, 42, (W - 44) * percent / 100, 7);

  if (previousGhost) {
    ctx.fillStyle = "#60f4ff";
    ctx.font = "bold 12px system-ui";
    ctx.fillText("GHOST RUN", 22, 68);
  }

  if (!playing) {
    ctx.fillStyle = "#060916cc";
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center";
    ctx.fillStyle = section.ground;
    ctx.font = "bold 38px system-ui";

    if (won) {
      ctx.fillText("RUN COMPLETE!", W / 2, 165);
    } else if (crashed) {
      ctx.fillText("YOU DIED", W / 2, 165);
    } else {
      ctx.fillText("PULSE RUNNER", W / 2, 165);
    }

    ctx.fillStyle = "#fff";
    ctx.font = "20px system-ui";

    if (won) {
      ctx.fillText("Press Space or tap to run again.", W / 2, 210);
    } else if (crashed) {
      ctx.fillText(
        `You reached ${percent}%. Press Space or tap to retry.`,
        W / 2,
        210
      );
    } else {
      ctx.fillText("Press Space or tap to start.", W / 2, 210);
      ctx.font = "15px system-ui";
      ctx.fillStyle = "#bdc9e8";
      ctx.fillText(
        "A clear runway comes first. Jump with Space, ↑, or a tap.",
        W / 2,
        244
      );
    }

    ctx.textAlign = "left";
  } else if (sectionFlash > 0) {
    ctx.fillStyle = "#07101dcc";
    ctx.fillRect(250, 145, 500, 80);
    ctx.textAlign = "center";
    ctx.fillStyle = section.ground;
    ctx.font = "bold 30px system-ui";
    ctx.fillText(section.name, W / 2, 195);
    ctx.textAlign = "left";
  }
}

function frame(timestamp) {
  if (lastTime === null) lastTime = timestamp;

  const elapsed = Math.min((timestamp - lastTime) / 1000, 0.05);
  lastTime = timestamp;
  accumulator += elapsed;

  while (accumulator >= fixedStep) {
    update(fixedStep);
    accumulator -= fixedStep;
  }

  draw();
  requestAnimationFrame(frame);
}

requestAnimationFrame(frame);
</script>
</body>
</html>
