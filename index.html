<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pulse Runner</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #080b18;
      color: #f4f6ff;
      font: 16px system-ui, sans-serif;
    }

    main { width: min(1000px, 96vw); }
    h1 { margin: 0 0 8px; letter-spacing: .12em; }
    p { color: #bac4e4; }

    .game-frame {
      position: relative;
      width: 100%;
    }

    canvas {
      display: block;
      width: 100%;
      border: 2px solid #45527b;
      border-radius: 12px;
      background: #10162b;
      touch-action: manipulation;
    }

    .hint { font-size: 14px; line-height: 1.6; }

    .overlay {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: grid;
      place-items: center;
      padding: 20px;
      border-radius: 12px;
      background: #060916cc;
      text-align: center;
    }

    .overlay[hidden], .pause-button[hidden] {
      display: none;
    }

    .panel {
      width: min(440px, 100%);
      padding: 24px;
      border: 1px solid #45527b;
      border-radius: 16px;
      background: #111a32f2;
      box-shadow: 0 18px 60px #0008;
    }

    .panel h2 {
      margin: 0 0 10px;
      color: #45f0c5;
      letter-spacing: .06em;
    }

    .panel p { margin: 0 0 18px; }

    button, select, input {
      font: inherit;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 11px 16px;
      background: #45f0c5;
      color: #08131c;
      font-weight: 750;
      cursor: pointer;
    }

    button:hover { filter: brightness(1.1); }

    button.secondary {
      margin-left: 8px;
      background: #344365;
      color: #fff;
    }

    .pause-button {
      position: absolute;
      z-index: 1;
      top: 16px;
      right: 16px;
      padding: 9px 13px;
      border: 1px solid #ffffff55;
      background: #101a35e8;
      color: #fff;
    }

    .setting {
      margin: 18px 0;
      text-align: left;
    }

    .setting label {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 7px;
      color: #f4f6ff;
      font-weight: 650;
    }

    .setting output { color: #45f0c5; }

    .setting input[type="range"] {
      width: 100%;
      accent-color: #45f0c5;
    }

    .setting select {
      width: 100%;
      padding: 10px;
      border: 1px solid #45527b;
      border-radius: 8px;
      background: #0b1020;
      color: #fff;
    }

    .settings-actions { margin-top: 20px; }
  </style>
</head>
<body>
<main>
  <h1>PULSE RUNNER</h1>
  <p>One long run through five different sections.</p>

  <div class="game-frame">
    <canvas id="game" width="1000" height="420"></canvas>

    <button id="pauseButton" class="pause-button" hidden>Ⅱ Pause</button>

    <div id="menuOverlay" class="overlay">
      <div class="panel">
        <h2 id="menuTitle">PULSE RUNNER</h2>
        <p id="menuMessage">Press Start when you’re ready. The first obstacle is far ahead.</p>
        <button id="mainButton">Start Game</button>
        <button id="menuSettingsButton" class="secondary">Settings</button>
      </div>
    </div>

    <div id="settingsOverlay" class="overlay" hidden>
      <div class="panel">
        <h2>SETTINGS</h2>

        <div class="setting">
          <label for="speedSetting">
            <span>Game speed</span>
            <output id="speedOutput">1.00×</output>
          </label>
          <input id="speedSetting" type="range" min="0.70" max="1.20" step="0.05" value="1">
        </div>

        <div class="setting">
          <label for="musicVoice">Music voice</label>
          <select id="musicVoice">
            <option value="triangle">Soft pulse</option>
            <option value="sine">Smooth tone</option>
            <option value="square">Chiptune</option>
            <option value="sawtooth">Synth</option>
          </select>
        </div>

        <div class="setting">
          <label for="volumeSetting">
            <span>Music volume</span>
            <output id="volumeOutput">35%</output>
          </label>
          <input id="volumeSetting" type="range" min="0" max="0.10" step="0.005" value="0.035">
        </div>

        <div class="settings-actions">
          <button id="previewButton">Preview music</button>
          <button id="closeSettingsButton" class="secondary">Done</button>
        </div>
      </div>
    </div>
  </div>

  <p class="hint">
    Space / ↑ / click / tap: jump · P: pause · M: music on/off · R: restart<br>
    The cyan ghost shows your best run saved in this browser.
  </p>
</main>

<script>
"use strict";

const canvas = document.querySelector("#game");
const ctx = canvas.getContext("2d");

const W = canvas.width;
const H = canvas.height;
const groundY = 330;
const chunkSize = 460;
const safeStart = 1100;
const sectionLength = 9200;
const sectionCount = 5;
const totalLength = sectionLength * sectionCount;
const fixedStep = 1 / 120;
const gravity = 1700;
const jumpVelocity = -660;

const BEST_RUN_KEY = "pulseRunnerBestRunV1";
const SETTINGS_KEY = "pulseRunnerSettingsV1";

const sections = [
  { name: "NEON CITY", sky: "#101a35", ground: "#39e8c2", accent: "#8a7dff", root: 220 },
  { name: "CRYSTAL CAVES", sky: "#10243a", ground: "#63d8ff", accent: "#b27dff", root: 196 },
  { name: "EMBER RUINS", sky: "#351b28", ground: "#ff945e", accent: "#ff5278", root: 174 },
  { name: "SKY CIRCUIT", sky: "#142a42", ground: "#f6ed78", accent: "#4cf0d5", root: 247 },
  { name: "THE VOID", sky: "#211633", ground: "#ff64db", accent: "#72a5ff", root: 164 }
];

const player = {
  x: 150,
  y: groundY - 34,
  size: 34,
  vy: 0,
  rotation: 0
};

const menuOverlay = document.querySelector("#menuOverlay");
const settingsOverlay = document.querySelector("#settingsOverlay");
const menuTitle = document.querySelector("#menuTitle");
const menuMessage = document.querySelector("#menuMessage");
const mainButton = document.querySelector("#mainButton");
const pauseButton = document.querySelector("#pauseButton");

const speedSetting = document.querySelector("#speedSetting");
const speedOutput = document.querySelector("#speedOutput");
const musicVoice = document.querySelector("#musicVoice");
const volumeSetting = document.querySelector("#volumeSetting");
const volumeOutput = document.querySelector("#volumeOutput");

let worldX = 0;
let objects = [];
let floors = [{ x: 0, w: safeStart }];
let nextChunk = safeStart;
let sectionIndex = 0;
let speed = 340;
let speedMultiplier = 1;
let grounded = true;
let jumpBuffer = 0;
let coyoteTime = 0;

let playing = false;
let paused = false;
let crashed = false;
let won = false;
let sectionFlash = 0;
let menuState = "start";

let ghostRun = [];

function loadBestRun() {
  try {
    const saved = JSON.parse(localStorage.getItem(BEST_RUN_KEY));

    if (!saved || !Array.isArray(saved.path)) {
      return { distance: 0, path: null };
    }

    const path = saved.path.filter(point =>
      point &&
      Number.isFinite(point.x) &&
      Number.isFinite(point.y)
    );

    return {
      distance: Number(saved.distance) || 0,
      path: path.length ? path : null
    };
  } catch {
    return { distance: 0, path: null };
  }
}

const savedBestRun = loadBestRun();
let bestDistance = savedBestRun.distance;
let bestGhost = savedBestRun.path;

function loadSettings() {
  try {
    const saved = JSON.parse(localStorage.getItem(SETTINGS_KEY));
    if (!saved) return {};

    return {
      speedMultiplier: Number.isFinite(saved.speedMultiplier)
        ? Math.min(1.2, Math.max(0.7, saved.speedMultiplier))
        : 1,
      musicVoice: ["triangle", "sine", "square", "sawtooth"].includes(saved.musicVoice)
        ? saved.musicVoice
        : "triangle",
      musicVolume: Number.isFinite(saved.musicVolume)
        ? Math.min(0.1, Math.max(0, saved.musicVolume))
        : 0.035
    };
  } catch {
    return {};
  }
}

const savedSettings = loadSettings();
speedMultiplier = savedSettings.speedMultiplier ?? 1;
let musicWave = savedSettings.musicVoice ?? "triangle";
let musicVolume = savedSettings.musicVolume ?? 0.035;

function saveSettings() {
  try {
    localStorage.setItem(SETTINGS_KEY, JSON.stringify({
      speedMultiplier,
      musicVoice: musicWave,
      musicVolume
    }));
  } catch {
    // Settings still work for the current page if storage is unavailable.
  }
}

function syncSettingsControls() {
  speedSetting.value = String(speedMultiplier);
  speedOutput.value = `${speedMultiplier.toFixed(2)}×`;
  musicVoice.value = musicWave;
  volumeSetting.value = String(musicVolume);
  volumeOutput.value = `${Math.round(musicVolume * 1000)}%`;
}

function saveBestRun() {
  if (worldX <= bestDistance || ghostRun.length < 2) return;

  bestDistance = worldX;
  bestGhost = ghostRun.slice();

  try {
    localStorage.setItem(
      BEST_RUN_KEY,
      JSON.stringify({ distance: bestDistance, path: bestGhost })
    );
  } catch {
    // The game still works if browser storage is unavailable.
  }
}

let audio = null;
let musicTimer = null;
let musicOn = true;
let beat = 0;

let lastTime = null;
let accumulator = 0;

function addBlock(x, height, width) {
  objects.push({
    type: "block",
    x,
    y: groundY - height,
    w: width,
    h: height
  });
}

function addHazard(type, x, y, w, h) {
  objects.push({ type, x, y, w, h });
}

function addSpikeRow(x, count) {
  for (let i = 0; i < count; i++) {
    addHazard("spike", x + i * 36, groundY - 34, 32, 34);
  }
}

function makeChunk(x) {
  const area = Math.min(
    sectionCount - 1,
    Math.floor(x / sectionLength)
  );
  const sectionEnd = (area + 1) * sectionLength;

  if (x + chunkSize > sectionEnd) {
    floors.push({ x, w: chunkSize });
    return;
  }

  const localChunk = Math.floor((x - area * sectionLength) / chunkSize);
  const pattern = localChunk % 3;

  if (area === 4) {
    // THE VOID: gaps only. Every other chunk stays safe.
    if (pattern === 1) {
      floors.push({ x, w: chunkSize });
      return;
    }

    const pitStart = x + 190;
    const pitWidth = 150 + pattern * 10;
    const pitEnd = pitStart + pitWidth;

    floors.push({ x, w: pitStart - x });
    floors.push({ x: pitEnd, w: x + chunkSize - pitEnd });
    return;
  }

  floors.push({ x, w: chunkSize });

  if (area === 0) {
    // NEON CITY: low blocks.
    if (pattern === 0) {
      addBlock(x + 175, 48, 60);
    } else if (pattern === 1) {
      addBlock(x + 125, 44, 56);
      addBlock(x + 270, 58, 62);
    } else {
      addBlock(x + 110, 52, 58);
      addBlock(x + 245, 62, 64);
    }
    return;
  }

  if (area === 1) {
    // CRYSTAL CAVES: climbable steps within the jump height.
    if (pattern === 0) {
      addBlock(x + 115, 42, 64);
      addBlock(x + 230, 58, 68);
      addBlock(x + 345, 48, 64);
    } else if (pattern === 1) {
      addBlock(x + 135, 52, 72);
      addBlock(x + 270, 66, 72);
    } else {
      addBlock(x + 105, 44, 62);
      addBlock(x + 215, 60, 68);
      addBlock(x + 330, 68, 70);
    }
    return;
  }

  if (area === 2) {
    // EMBER RUINS: spikes only.
    addSpikeRow(x + 175, pattern + 1);
    return;
  }

  // SKY CIRCUIT: jumpable laser gates only.
  const count = pattern === 2 ? 2 : 1;

  for (let i = 0; i < count; i++) {
    const laserHeight = 88 + pattern * 5;
    addHazard(
      "laser",
      x + 205 + i * 145,
      groundY - laserHeight,
      20,
      laserHeight
    );
  }
}

function ensureWorld() {
  while (nextChunk < worldX + W + 700) {
    makeChunk(nextChunk);
    nextChunk += chunkSize;
  }

  objects = objects.filter(object => object.x + object.w > worldX - 100);
  floors = floors.filter(floor => floor.x + floor.w > worldX - 100);
}

function showMenu(state) {
  menuState = state;

  if (state === "playing") {
    menuOverlay.hidden = true;
    settingsOverlay.hidden = true;
    pauseButton.hidden = false;
    return;
  }

  pauseButton.hidden = true;
  menuOverlay.hidden = false;

  if (state === "start") {
    menuTitle.textContent = "PULSE RUNNER";
    menuMessage.textContent = "Press Start when you’re ready. The first obstacle is far ahead.";
    mainButton.textContent = "Start Game";
  } else if (state === "paused") {
    menuTitle.textContent = "PAUSED";
    menuMessage.textContent = "Take a break. Your run is waiting.";
    mainButton.textContent = "Resume";
  } else if (state === "dead") {
    menuTitle.textContent = "YOU DIED";
    menuMessage.textContent =
      `You reached ${Math.floor(worldX / totalLength * 100)}%. Try again to beat your best.`;
    mainButton.textContent = "Retry";
  } else if (state === "won") {
    menuTitle.textContent = "RUN COMPLETE!";
    menuMessage.textContent = "You made it through all five sections.";
    mainButton.textContent = "Play Again";
  }
}

function resetGame() {
  saveBestRun();

  worldX = 0;
  objects = [];
  floors = [{ x: 0, w: safeStart }];
  nextChunk = safeStart;

  sectionIndex = 0;
  speed = 340;
  grounded = true;
  jumpBuffer = 0;
  coyoteTime = 0;

  player.y = groundY - player.size;
  player.vy = 0;
  player.rotation = 0;

  playing = true;
  paused = false;
  crashed = false;
  won = false;
  sectionFlash = 0;
  accumulator = 0;
  beat = 0;

  ghostRun = [{ x: 0, y: player.y }];

  ensureWorld();
  startMusic();
  showMenu("playing");
}

function jump() {
  if (!playing) {
    if (menuState === "paused") return;
    resetGame();
    jumpBuffer = 0.14;
    return;
  }

  jumpBuffer = 0.14;
}

function pauseGame() {
  if (!playing) return;

  playing = false;
  paused = true;
  stopMusic();
  showMenu("paused");
}

function resumeGame() {
  if (!paused) return;

  paused = false;
  playing = true;
  startMusic();
  showMenu("playing");
}

function keyHandler(event) {
  if (["Space", "ArrowUp", "KeyW"].includes(event.code)) {
    event.preventDefault();

    if (!event.repeat) {
      if (menuState === "paused") resumeGame();
      else jump();
    }
  }

  if (event.code === "KeyP") {
    if (playing) pauseGame();
    else if (paused) resumeGame();
  }

  if (event.code === "KeyM") {
    musicOn = !musicOn;
    if (musicOn) startMusic();
    else stopMusic();
  }

  if (event.code === "KeyR") resetGame();

  if (event.code === "Escape" && !settingsOverlay.hidden) {
    settingsOverlay.hidden = true;
  }
}

addEventListener("keydown", keyHandler);
canvas.addEventListener("pointerdown", jump);

mainButton.addEventListener("click", () => {
  if (menuState === "paused") resumeGame();
  else resetGame();
});

pauseButton.addEventListener("click", pauseGame);

document.querySelector("#menuSettingsButton").addEventListener("click", () => {
  settingsOverlay.hidden = false;
});

document.querySelector("#closeSettingsButton").addEventListener("click", () => {
  settingsOverlay.hidden = true;
});

speedSetting.addEventListener("input", () => {
  speedMultiplier = Number(speedSetting.value);
  speedOutput.value = `${speedMultiplier.toFixed(2)}×`;
  saveSettings();
});

musicVoice.addEventListener("change", () => {
  musicWave = musicVoice.value;
  saveSettings();
});

volumeSetting.addEventListener("input", () => {
  musicVolume = Number(volumeSetting.value);
  volumeOutput.value = `${Math.round(musicVolume * 1000)}%`;
  saveSettings();
});

document.querySelector("#previewButton").addEventListener("click", () => {
  const AudioContextClass = window.AudioContext || window.webkitAudioContext;
  if (!AudioContextClass) return;

  if (!audio) audio = new AudioContextClass();
  audio.resume();

  const root = sections[sectionIndex].root;
  playTone(root, 0.25, musicWave, 1);
  playTone(root * 1.5, 0.25, musicWave, 0.7);
});

function startMusic() {
  if (!musicOn) return;

  const AudioContextClass = window.AudioContext || window.webkitAudioContext;
  if (!AudioContextClass) return;

  if (!audio) audio = new AudioContextClass();
  audio.resume();

  if (musicTimer) return;

  musicTimer = setInterval(() => {
    if (!playing || !musicOn || !audio) return;

    const section = sections[sectionIndex];
    const scale = [0, 3, 5, 7, 10, 12, 15, 17];
    const step = scale[(beat * 3 + sectionIndex) % scale.length];
    const note = section.root * Math.pow(2, step / 12);

    playTone(note, beat % 4 === 0 ? 0.15 : 0.07, musicWave, 1);

    if (beat % 4 === 0) {
      playTone(section.root / 2, 0.12, musicWave, 0.55);
    }

    beat++;
  }, 180);
}

function stopMusic() {
  if (musicTimer) {
    clearInterval(musicTimer);
    musicTimer = null;
  }
}

function playTone(frequency, duration, wave, volumeScale = 1) {
  if (!audio || musicVolume <= 0) return;

  const oscillator = audio.createOscillator();
  const gain = audio.createGain();
  const peak = Math.max(0.0001, musicVolume * volumeScale);

  oscillator.type = wave;
  oscillator.frequency.value = frequency;

  gain.gain.setValueAtTime(0.0001, audio.currentTime);
  gain.gain.exponentialRampToValueAtTime(peak, audio.currentTime + 0.015);
  gain.gain.exponentialRampToValueAtTime(
    0.0001,
    audio.currentTime + duration
  );

  oscillator.connect(gain);
  gain.connect(audio.destination);
  oscillator.start();
  oscillator.stop(audio.currentTime + duration + 0.02);
}

function overlaps(a, b) {
  return a.x < b.x + b.w &&
         a.x + a.w > b.x &&
         a.y < b.y + b.h &&
         a.y + a.h > b.y;
}

function die() {
  if (!playing) return;

  ghostRun.push({ x: worldX, y: player.y });
  saveBestRun();

  crashed = true;
  playing = false;
  grounded = false;
  stopMusic();
  showMenu("dead");
}

function update(dt) {
  if (!playing) return;

  jumpBuffer = Math.max(0, jumpBuffer - dt);
  coyoteTime = Math.max(0, coyoteTime - dt);

  const oldBottom = player.y + player.size;

  const newSection = Math.min(
    sectionCount - 1,
    Math.floor(worldX / sectionLength)
  );

  if (newSection !== sectionIndex) {
    sectionIndex = newSection;
    sectionFlash = 1.5;
    beat = 0;
  }

  const sectionProgress = (worldX % sectionLength) / sectionLength;
  speed = (340 + sectionIndex * 12 + sectionProgress * 12) * speedMultiplier;

  worldX += speed * dt;
  ensureWorld();

  player.vy += gravity * dt;
  player.y += player.vy * dt;
  player.rotation += speed * dt * 0.012;

  grounded = false;

  const playerWorld = {
    x: worldX + player.x,
    y: player.y,
    w: player.size,
    h: player.size
  };

  // Land on block tops; side impacts are deadly.
  for (const object of objects) {
    if (object.type !== "block") continue;

    const overlapsX =
      playerWorld.x < object.x + object.w &&
      playerWorld.x + playerWorld.w > object.x;

    const crossedTop =
      oldBottom <= object.y + 4 &&
      player.y + player.size >= object.y &&
      player.vy >= 0;

    if (overlapsX && crossedTop) {
      player.y = object.y - player.size;
      player.vy = 0;
      playerWorld.y = player.y;
      grounded = true;
    } else if (overlaps(playerWorld, object)) {
      die();
      return;
    }
  }

  // Land only when the player is above a floor segment.
  if (!grounded) {
    const centerX = worldX + player.x + player.size / 2;
    const hasFloor = floors.some(
      floor => centerX >= floor.x && centerX <= floor.x + floor.w
    );

    if (
      hasFloor &&
      oldBottom <= groundY + 2 &&
      player.y + player.size >= groundY &&
      player.vy >= 0
    ) {
      player.y = groundY - player.size;
      player.vy = 0;
      grounded = true;
    }
  }

  playerWorld.y = player.y;

  // Hazard collisions.
  for (const object of objects) {
    if (object.type === "block") continue;

    const hitbox = object.type === "spike"
      ? {
          x: object.x + 5,
          y: object.y + 8,
          w: object.w - 10,
          h: object.h - 8
        }
      : object;

    if (overlaps(playerWorld, hitbox)) {
      die();
      return;
    }
  }

  if (player.y > H + 45) {
    die();
    return;
  }

  if (grounded) coyoteTime = 0.12;

  if (jumpBuffer > 0 && (grounded || coyoteTime > 0)) {
    player.vy = jumpVelocity;
    grounded = false;
    jumpBuffer = 0;
    coyoteTime = 0;
  }

  ghostRun.push({ x: worldX, y: player.y });

  if (worldX >= totalLength) {
    playing = false;
    won = true;
    saveBestRun();
    stopMusic();
    showMenu("won");
  }

  if (sectionFlash > 0) sectionFlash -= dt;
}

function ghostYAt(distance) {
  if (!bestGhost || bestGhost.length === 0) return null;
  if (distance < bestGhost[0].x) return bestGhost[0].y;
  if (distance > bestGhost[bestGhost.length - 1].x) return null;

  let low = 0;
  let high = bestGhost.length - 1;

  while (low < high) {
    const mid = Math.floor((low + high) / 2);
    if (bestGhost[mid].x < distance) low = mid + 1;
    else high = mid;
  }

  const after = bestGhost[low];
  const before = bestGhost[Math.max(0, low - 1)];
  const span = after.x - before.x;

  if (span <= 0) return after.y;

  const amount = (distance - before.x) / span;
  return before.y + (after.y - before.y) * amount;
}

function draw() {
  const section = sections[sectionIndex];

  ctx.fillStyle = section.sky;
  ctx.fillRect(0, 0, W, H);

  // Distant lights move more slowly than the level.
  ctx.globalAlpha = 0.25;
  ctx.fillStyle = section.accent;

  for (let i = 0; i < 18; i++) {
    const x = ((i * 91 - worldX * 0.2) % (W + 80) + W + 80) % (W + 80);
    ctx.fillRect(x, 65 + (i * 37) % 190, 3, 3);
  }

  ctx.globalAlpha = 1;

  for (const floor of floors) {
    const screenX = floor.x - worldX;
    ctx.fillStyle = "#263454";
    ctx.fillRect(screenX, groundY, floor.w, H - groundY);
    ctx.fillStyle = section.ground;
    ctx.fillRect(screenX, groundY, floor.w, 4);
  }

  for (const object of objects) {
    const x = object.x - worldX;

    if (object.type === "block") {
      ctx.fillStyle = "#596a96";
      ctx.fillRect(x, object.y, object.w, object.h);
      ctx.fillStyle = section.ground;
      ctx.fillRect(x, object.y, object.w, 5);
      ctx.fillStyle = "#8291ba";

      for (let bx = x + 12; bx < x + object.w; bx += 24) {
        ctx.fillRect(bx, object.y + 12, 3, Math.max(4, object.h - 18));
      }
    } else if (object.type === "spike") {
      ctx.fillStyle = "#ff5478";
      ctx.beginPath();
      ctx.moveTo(x, object.y + object.h);
      ctx.lineTo(x + object.w / 2, object.y);
      ctx.lineTo(x + object.w, object.y + object.h);
      ctx.closePath();
      ctx.fill();
    } else if (object.type === "saw") {
      ctx.fillStyle = "#ffd15c";
      ctx.beginPath();
      ctx.arc(x + object.w / 2, object.y + object.h / 2, object.w / 2, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = "#713a43";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(x + 8, object.y + 8);
      ctx.lineTo(x + object.w - 8, object.y + object.h - 8);
      ctx.moveTo(x + object.w - 8, object.y + 8);
      ctx.lineTo(x + 8, object.y + object.h - 8);
      ctx.stroke();
    } else if (object.type === "laser") {
      ctx.fillStyle = "#ff365f";
      ctx.fillRect(x, object.y, object.w, object.h);
      ctx.fillStyle = "#ffd4df";
      ctx.fillRect(x + 7, object.y, 5, object.h);
    }
  }

  // Best-run ghost.
  const ghostY = ghostYAt(worldX);

  if (ghostY !== null) {
    ctx.save();
    ctx.globalAlpha = 0.35;
    ctx.fillStyle = "#60f4ff";
    ctx.fillRect(player.x, ghostY, player.size, player.size);
    ctx.restore();
  }

  // Player.
  ctx.save();
  ctx.translate(player.x + player.size / 2, player.y + player.size / 2);
  if (!grounded) ctx.rotate(player.rotation);
  ctx.fillStyle = "#f8f7ff";
  ctx.fillRect(-player.size / 2, -player.size / 2, player.size, player.size);
  ctx.fillStyle = section.accent;
  ctx.fillRect(4, -8, 6, 6);
  ctx.restore();

  const percent = Math.min(100, Math.floor(worldX / totalLength * 100));

  ctx.fillStyle = "#fff";
  ctx.font = "bold 17px system-ui";
  ctx.fillText(
    `SECTION ${sectionIndex + 1} / ${sectionCount}  ·  ${section.name}`,
    22,
    30
  );

  ctx.textAlign = "right";
  ctx.fillText(`${percent}%`, W - 22, 30);
  ctx.textAlign = "left";

  ctx.fillStyle = "#ffffff30";
  ctx.fillRect(22, 42, W - 44, 7);
  ctx.fillStyle = section.ground;
  ctx.fillRect(22, 42, (W - 44) * percent / 100, 7);

  if (bestGhost) {
    const bestPercent = Math.floor(bestDistance / totalLength * 100);
    ctx.fillStyle = "#60f4ff";
    ctx.font = "bold 12px system-ui";
    ctx.fillText(`BEST GHOST · ${bestPercent}%`, 22, 68);
  }

  if (sectionFlash > 0 && playing) {
    ctx.fillStyle = "#07101dcc";
    ctx.fillRect(250, 145, 500, 80);
    ctx.textAlign = "center";
    ctx.fillStyle = section.ground;
    ctx.font = "bold 30px system-ui";
    ctx.fillText(section.name, W / 2, 195);
    ctx.textAlign = "left";
  }
}

function frame(timestamp) {
  if (lastTime === null) lastTime = timestamp;

  const elapsed = Math.min((timestamp - lastTime) / 1000, 0.05);
  lastTime = timestamp;
  accumulator += elapsed;

  while (accumulator >= fixedStep) {
    update(fixedStep);
    accumulator -= fixedStep;
  }

  draw();
  requestAnimationFrame(frame);
}

syncSettingsControls();
showMenu("start");
requestAnimationFrame(frame);
</script>
</body>
</html>
